[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Ectoplasm-Steganography"
version = "0.0.12"
authors = [
  { name="thomas-xin", email="thomasxin@gmail.com" },
]
description = "A versatile lossless text/data encoding steganography algorithm + pipeline for images"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "base45>=0.4.4",
  "bitarray>=3.8.0",
  "brotli>=1.2.0",
  "numpy>=2.2.6",
  "opencv-python>=4.12.0.88",
  "pillow>=12.0.0",
  "pyqrcode>=1.2.1",
  "pyzbar>=0.1.9",
  "pyzpaq>=0.1.11",
  "raptorq>=2.0.0",
  "reedsolo>=1.7.0",
  "streamshatter>=1.1.9",
]

[project.optional-dependencies]
full = [
  "c2pa-python>=0.27.1",
  "filetype>=1.2.0",
]

[project.scripts]
ectoplasm = "ectoplasm.__main__:main"

[project.urls]
Homepage = "https://github.com/thomas-xin/Ectoplasm-Steganography"
Issues = "https://github.com/thomas-xin/Ectoplasm-Steganography/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ectoplasm"]